# Dress rehearsal: A more serious 'flush through' of system, but they should result in meaningful results, i.e loss curves and comparable metrics

test_name: dress_rehearsal

hydra:
  run:
    dir: ${hydra:runtime.cwd}/logs/${project.project}/${project.task}/testing/dress_rehearsal/${project.timestamp}
  sweep:
    dir: logs/${project.project}/${project.task}/testing/dress_rehearsal/${project.timestamp}

wandb_mode: online
dataset_testing_type: reduced
epochs: 3
plotting: True
time_analysis: False

energy_distance:
  K_cross: ${evaluate.energy_distance_test.K_cross}
  K_within: ${evaluate.energy_distance_test.K_within}
  batch_size: ${evaluate.energy_distance_test.batch_size}
  num_permutations: ${evaluate.energy_distance_test.num_permutations}