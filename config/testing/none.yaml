# None: no testing, run script as normal 

test_name: none

hydra:
  run:
    dir: ${hydra:runtime.cwd}/logs/${project.project}/${project.task}/${project.name}_${project.timestamp}
  sweep:
    dir: logs/${project.project}/${project.task}/${project.name}_${project.timestamp}


wandb_mode: online 
dataset_testing_type: full
epochs: ${max_epochs}
plotting: False
time_analysis: False
num_workers: 6

# evaluate data group metric settings
sample_size: 200000
n_samples: 10
batch_size: 2048

# OBSOLETE
energy_distance:
  K_cross: ${evaluate.energy_distance_standard.K_cross}
  K_within: ${evaluate.energy_distance_standard.K_within}
  batch_size: ${evaluate.energy_distance_standard.batch_size}
  num_permutations: ${evaluate.energy_distance_standard.num_permutations}