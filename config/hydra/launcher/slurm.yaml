#config/hydra/launcher/slurm.yaml

defaults:
  - submitit_slurm

_target_: hydra_plugins.hydra_submitit_launcher.submitit_launcher.SlurmLauncher
submitit_folder: ${hydra.sweep.dir}/.submitit/%j

timeout_min: 1440
mem_gb: 64
cpus_per_task: ${dataset.general_dataset_config.num_workers}

# timeout_min: 60 #1440
# mem_gb: 16
# cpus_per_task: 1

partition: orchid #standard
qos: orchid #short
account: orchid #iecdt

gres: gpu:1

exclude: gpuhost004,gpuhost009,gpuhost012,gpuhost007


