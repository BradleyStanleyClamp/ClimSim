
defaults:
  - _self_
  - project: config
  - wandb/wkey: wkey
  - dataset: sub_sampled_low_res
  - dataset/general_dataset_config: general_dataset_config
  - evaluate: evaluate_metrics
  - hydra: default
  - testing: qt
  - override hydra/launcher: slurm

multirun_dir_name: ${metric_name}_${evaluation_options[0]}

chunk_size: 1000

evaluation_options: 
  - multivariate
  # - marginals
  # - vis_marginals
  # - kl_divergence
  
metric_name: energy_distance #kl_divergence #

energy_distance:
  K_cross: ${testing.energy_distance.K_cross} 
  K_within: ${testing.energy_distance.K_within} 
  batch_size: ${testing.energy_distance.batch_size} 
  num_permutations: ${testing.energy_distance.num_permutations} 

vis_marginals: # marginal distributions for visualisation
  sample_size: 1000000
  variables:
    # - near_surface_air_temperature
    # - near_surface_specific_humidity
    - top_3_levels_specific_humidity
  groups_to_plot:
    - 0
    - 6

kl_divergence:
  n_components: ${evaluate.kl_divergence.n_components}
  bandwidth: ${evaluate.kl_divergence.bandwidth}
  bw_grid: ${evaluate.kl_divergence.bw_grid}
  sample_size: ${evaluate.kl_divergence.sample_size}

marginal_distributions:
  metric: energy_distance

