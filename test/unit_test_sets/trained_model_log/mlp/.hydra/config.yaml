multirun_dir_name: ${model.name}
max_epochs: 2000
sweep: false
project:
  project: p2.1.1
  task: '5'
  name: implementing_base_mlp
  timestamp: ${now:%Y-%m-%d-%H-%M-%S}
  seed: 0
wandb:
  wkey:
    wkey: d162c7366b8f497517106439f80ecee449b45d07
model:
  name: mlp
  early_stopping_patience: 200
  sweep_configuration:
    name: ${project.name}_process_${proc_seed}_mlp
    method: random
    metric:
      name: val/loss
      goal: minimize
    parameters:
      lr:
        distribution: log_uniform_values
        min: 1.0e-05
        max: 0.1
      batch_size:
        values:
        - 16
        - 32
        - 64
        - 128
        - 256
        - 512
        - 1024
      hidden_dim:
        values:
        - 1
        - 2
        - 8
        - 16
        - 32
        - 64
        - 128
        - 256
      nhidden:
        values:
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
        - 7
        - 8
  single_run_configuration:
    lr: 0.001
    batch_size: 2048
    hidden_dims:
    - 512
    - 256
    activation: relu
    optimizer: Adam
    scheduler: None
dataset:
  dataset_name: subsampled_low_res
  data_path: /gws/nopw/j04/iecdt/bstanleyclamp/climsim_data/subsampled_low_res/
  precomputed_quick_data_path: test/unit_test_sets/sub_sampled_low_res/
  input_dim: 124
  output_dim: 128
  dataset_testing_fractions:
    unit_test: 3840
    quick: 1.0
    reduced: 38400
    full: 1.0
  general_dataset_config:
    num_workers: 1
testing:
  test_name: dress_rehearsal
  hydra:
    run:
      dir: ${hydra:runtime.cwd}/logs/${project.project}/${project.task}/testing/dress_rehearsal/${project.timestamp}
    sweep:
      dir: logs/${project.project}/${project.task}/testing/dress_rehearsal/${project.timestamp}
  wandb_mode: online
  dataset_testing_type: reduced
  epochs: 10
  plotting: true
  timings: false
